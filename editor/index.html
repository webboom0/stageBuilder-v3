<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
  <title>StageBuilder v4</title>
  <link rel="icon" href="images/stagebuilder-logo.png" type="image/png" />
  <link rel="apple-touch-icon" href="images/stagebuilder-logo.png" />
  <!-- v3 editor/index.html — 동일 CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css"
    integrity="sha512-kJlvECunwXftkPwyvHbclArO8wszgBGisiLeuDFwNM8ws+wKIw0sv1os3ClWZOcrEB2eRXULYUsm8OVRGJKwGA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="css/editor-shell.css" />
  <link rel="stylesheet" href="css/timeline.css" />
</head>
<body class="premiere-workspace">
  <div class="wrapper">
    <div class="viewerWrapper sb-editor-grid">
      <aside class="side sb-left" id="sidebar-left">
        <nav id="sidebar-left-rail" class="sb-left-rail" aria-label="왼쪽 도구"></nav>
        <div id="sidebar-left-dock" class="sb-left-dock"></div>
      </aside>

      <div class="viewer sb-program">
        <div class="topWrapper">
          <div class="topMenuBar">
            <a class="sb-brand-mark" href="javascript:void(0)" title="StageBuilder" aria-label="StageBuilder">
              <img src="images/stagebuilder-logo.png" width="18" height="18" alt="StageBuilder" draggable="false" />
            </a>
            <div id="menubar" class="menubar" aria-label="메뉴"></div>
            <div id="viewport-controls" class="menubar-viewport-controls"></div>
          </div>
        </div>
        <div id="viewport"></div>
        <div class="toolBar">
          <div id="toolbar" class="sb-viewport-toolbar" aria-label="뷰프리셋"></div>
        </div>
        <div id="status">Initializing…</div>
      </div>

      <aside class="side sb-right">
        <div id="sidebar-right-dock" class="sb-right-dock"></div>
        <nav id="sidebar-right-rail" class="sb-right-rail" aria-label="오른쪽 패널"></nav>
      </aside>
    </div>
    <div class="timelineWrapper">
      <div id="timeline" class="timeline" aria-label="타임라인"></div>
    </div>
  </div>

  <script>
    (function () {
      const port = location.port;
      const isLiveServer = port === '5500' || port === '5501' || port === '8080';
      const isFile = location.protocol === 'file:';
      const isV4Server = port === '3000' && location.pathname.includes('/stageBuilder');
      if (isLiveServer || isFile) {
        window.__SB_WRONG_HOST__ = true;
        const url = 'http://localhost:3000/stageBuilder/index.html';
        const msg = [
          'Live Server / file:// 로는 StageBuilder v4를 실행할 수 없습니다.',
          '',
          '1. 터미널: node server/server.js',
          '2. 브라우저: ' + url,
          '',
          '(Three.js /files/stage/ API는 포트 3000 서버가 제공합니다)',
        ].join('\n');
        const status = document.getElementById('status');
        if (status) status.textContent = 'node server/server.js 후 localhost:3000/stageBuilder/ 로 여세요';
        const box = document.createElement('div');
        box.id = 'sb-wrong-host';
        box.style.cssText = [
          'position:fixed', 'inset:0', 'z-index:99999', 'display:flex', 'align-items:center',
          'justify-content:center', 'background:#111', 'color:#eee', 'font:14px/1.6 sans-serif',
          'padding:24px', 'text-align:center',
        ].join(';');
        box.innerHTML = [
          '<div style="max-width:520px">',
          '<p style="font-size:18px;margin:0 0 12px"><strong>잘못된 실행 방식</strong></p>',
          '<p style="opacity:.85;margin:0 0 16px">VS Code Live Server(5500) 또는 HTML 파일 직접 열기는 지원하지 않습니다.</p>',
          '<pre style="text-align:left;background:#222;padding:12px;border-radius:8px;margin:0 0 16px">node server/server.js</pre>',
          '<p style="margin:0 0 12px"><a href="' + url + '" style="color:#7ec8a3">' + url + '</a></p>',
          '</div>',
        ].join('');
        document.body.appendChild(box);
        return;
      }
      if (!isV4Server && (location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
        console.warn('[StageBuilder] Open http://localhost:3000/stageBuilder/index.html (not /editor/)');
      }
    })();
  </script>
  <script type="importmap">
  {
    "imports": {
      "three": "../build/three.module.js",
      "three/addons/": "../examples/jsm/"
    }
  }
  </script>
  <script type="module">
    if (window.__SB_WRONG_HOST__) {
      throw new Error('Use http://localhost:3000/stageBuilder/index.html');
    }
    import './js/app/bootstrap.js';
  </script>
</body>
</html>
